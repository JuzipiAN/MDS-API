plugins {
    id 'java'
}

version = '1.2.0'
group = 'com.juzipi.criticalhits'

base {
    archivesName = 'mds-api-neoforge-26.3'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// Plan B：不用 moddev（maven.neoforged.net 连不上），直接用实例里的本地 jar
def MCDIR = 'C:/Users/Default/AppData/Roaming/.minecraft'
def INST  = MCDIR + '/versions/26.3-NeoForge_26.3.0.83'

repositories { mavenCentral() }

dependencies {
    implementation files(INST + '/26.3-NeoForge_26.3.0.83.jar')
    implementation fileTree(dir: MCDIR + '/libraries', include: ['**/*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-nowarn']
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
