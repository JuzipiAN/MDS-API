plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

System.setProperty('file.encoding', 'UTF-8')
tasks.withType(AbstractCopyTask).configureEach {
    filteringCharset = 'UTF-8'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = 'mds-api-fabric-26.3'
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.isxander.dev/releases/" }
}


dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation files("${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-merged.jar")
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly files("C:/Users/Default/AppData/Roaming/.minecraft/versions/26.3-Fabric 0.19.5/mods/cloth-config-26.3.158.jar")
}

processResources {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.classpath += files("${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-merged.jar")
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('sourcesJar') {
}

jar {
    from("LICENSE") {
        rename { "${it}_modern-damage-system" }
    }
}
